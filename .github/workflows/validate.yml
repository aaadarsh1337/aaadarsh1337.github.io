name: Validate site

on:
  push:
    paths:
      - "index.html"
      - "404.html"
      - "css/**"
      - "js/**"
      - "blog/**"
      - "writeups/**"
      - "intel/**"
      - "assets/**"
      - "scripts/**"
      - "robots.txt"
      - ".github/workflows/validate.yml"
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install build deps (pinned)
        run: pip install "markdown==3.7" "Pygments==2.19.1"

      - name: Python compiles
        run: |
          python3 -m py_compile scripts/build_writeups.py
          python3 -m py_compile scripts/build_intel.py
          python3 -m py_compile scripts/build_blog.py
          rm -rf scripts/__pycache__

      - name: JS syntax check
        run: |
          node --check js/main.js
          node --check js/config.js
          test -f writeups/js/filter.js && node --check writeups/js/filter.js
          test -f writeups/js/page.js && node --check writeups/js/page.js
          test -f intel/js/intel.js && node --check intel/js/intel.js
          test -f blog/js/blog.js && node --check blog/js/blog.js

      - name: Generated CSS in sync
        run: |
          diff scripts/style.css writeups/css/style.css
          diff scripts/intel-style.css intel/css/style.css
          diff scripts/blog-style.css blog/css/style.css
          diff blog/css/pygments.css writeups/css/pygments.css

      - name: Generated JS in sync with builder sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          import build_writeups as bw
          import build_blog as bb
          import build_intel as bi
          pairs = [
              (bw.FILTER_JS, Path("writeups/js/filter.js")),
              (bw.PAGE_JS, Path("writeups/js/page.js")),
              (bb.BLOG_JS, Path("blog/js/blog.js")),
              (bi.INTEL_JS, Path("intel/js/intel.js")),
          ]
          for expected, path in pairs:
              actual = path.read_text(encoding="utf-8")
              if actual != expected:
                  raise SystemExit(f"out of sync: {path} does not match builder constant")
              print(f"ok: {path}")
          PY

      - name: Blog artifacts present
        run: |
          test -f blog/index.html
          test -f blog/search.json

      - name: Social card present
        run: test -f assets/og.png

      - name: No sitemaps
        run: |
          test ! -e sitemap.xml
          test ! -e writeups/sitemap-writeups.xml
          test ! -e intel/sitemap-intel.xml
          ! grep -ri "sitemap" robots.txt index.html 404.html scripts/build_writeups.py scripts/build_intel.py || exit 1

      - name: No inline event handlers
        run: |
          ! grep -rn "onerror=\|onclick=\|onload=" index.html 404.html scripts/build_writeups.py scripts/build_intel.py scripts/build_blog.py || exit 1

      - name: SRI present for lazy CDN helpers
        run: |
          test "$(grep -c 'integrity: "sha384-' js/main.js)" -ge 3

      - name: CSP present
        run: |
          grep -q "Content-Security-Policy" index.html
          grep -q "Content-Security-Policy" 404.html
          grep -q "Content-Security-Policy" scripts/build_writeups.py
          grep -q "Content-Security-Policy" scripts/build_intel.py
          grep -q "Content-Security-Policy" scripts/build_blog.py
          grep -q "Content-Security-Policy" blog/index.html

      - name: No committed token / no __pycache__
        run: |
          ! grep -rn "Authorization.*Bearer" js/ || exit 1
          ! git ls-files | grep -q "__pycache__\|\.pyc$" || exit 1
