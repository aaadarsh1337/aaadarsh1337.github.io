name: Notify portfolio blog

on:
  push:
    branches: [main]
    paths:
      - "posts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify-portfolio-blog
  cancel-in-progress: true

env:
  PORTFOLIO_REPO: aaadarsh1337/aaadarsh1337.github.io

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch portfolio rebuild
        env:
          DISPATCH_TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::error::PORTFOLIO_DISPATCH_TOKEN is not set. Add it under Settings > Secrets and variables > Actions in security-blog."
            exit 1
          fi

          hdr="$RUNNER_TEMP/dispatch-headers.txt"
          out="$RUNNER_TEMP/dispatch-body.txt"
          code="$(curl -sS -D "$hdr" -o "$out" -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            "https://api.github.com/repos/$PORTFOLIO_REPO/dispatches" \
            -d '{"event_type":"blog-updated"}')"

          echo "POST /repos/$PORTFOLIO_REPO/dispatches -> HTTP $code"

          if [ "$code" = "204" ]; then
            echo "Dispatch sent. The portfolio 'Build security blog' workflow will run."
            exit 0
          fi

          echo "Response body:"
          cat "$out" || true
          echo
          echo "Token response headers:"
          grep -iE '^(x-oauth-scopes|x-accepted-github-permissions|x-ratelimit-remaining|retry-after):' "$hdr" || cat "$hdr"

          access_code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            "https://api.github.com/repos/$PORTFOLIO_REPO")"
          echo "GET /repos/$PORTFOLIO_REPO -> HTTP $access_code"

          case "$code" in
            403)
              if [ "$access_code" != "200" ]; then
                echo "::error::Token cannot see $PORTFOLIO_REPO (GET returned HTTP $access_code). A fine-grained PAT must list $PORTFOLIO_REPO under Repository access; a classic PAT needs the repo scope."
              else
                echo "::error::Token can read $PORTFOLIO_REPO but is not allowed to dispatch. Grant Contents: Read and write on $PORTFOLIO_REPO (fine-grained PAT), or use a classic PAT with the repo scope, then re-run this workflow."
              fi
              ;;
            404)
              echo "::error::404 from the dispatch endpoint. Confirm the target repo name ($PORTFOLIO_REPO) and that the token owner has push access to it."
              ;;
            401)
              echo "::error::Token was rejected (401). It is expired or revoked - regenerate PORTFOLIO_DISPATCH_TOKEN."
              ;;
            *)
              echo "::error::Dispatch failed with HTTP $code - see the response body above."
              ;;
          esac
          exit 1
